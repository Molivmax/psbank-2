name: Build Android APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências e binário nativo do Linux
        run: |
          cd bankseg.orig
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @tailwindcss/oxide-linux-x64-gnu

      - name: Instalar Capacitor e dependências Android
        run: |
          cd bankseg.orig
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Compilar projeto React (Vite)
        run: |
          cd bankseg.orig
          npm run build

      - name: Inicializar projeto Android nativo
        run: |
          cd bankseg.orig
          npx cap add android || true
          npx cap sync android

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Atualizar Gradle Wrapper para 8.5 e Compilar APK
        run: |
          cd bankseg.orig/android
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.5-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.2.1-bin.zip/gradle-8.5-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PastaSegura-App
          path: bankseg.orig/android/app/build/outputs/apk/debug/app-debug.apk
