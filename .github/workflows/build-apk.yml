name: Build Android APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Limpar módulos do Windows e instalar dependências limpas
        run: |
          cd bankseg.orig
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Instalar Capacitor e dependências Android
        run: |
          cd bankseg.orig
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Compilar projeto React (Vite)
        run: |
          cd bankseg.orig
          npm run build

      - name: Inicializar projeto Android nativo
        run: |
          cd bankseg.orig
          npx cap add android || true
          npx cap sync android

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Compilar APK (Gradle)
        run: |
          cd bankseg.orig/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PastaSegura-App
          path: bankseg.orig/android/app/build/outputs/apk/debug/app-debug.apk
