name: Build Android APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e binário nativo do Linux
        run: |
          cd bankseg.orig
          rm -rf node_modules package-lock.json
          sed -i 's/"@babel\/types": "[^"]*"/"@babel\/types": "^7.24.0"/g' package.json
          npm install --legacy-peer-deps --force
          npm install --legacy-peer-deps --force @tailwindcss/oxide-linux-x64-gnu

      - name: Instalar Capacitor e plugins nativos (Launcher e Geolocation)
        run: |
          cd bankseg.orig
          npm install --legacy-peer-deps --force @capacitor/core @capacitor/cli @capacitor/android @capacitor/app-launcher @capacitor/geolocation

      - name: Corrigir abertura nativa dos bancos no código
        run: |
          cd bankseg.orig
          find src -type f \( -name "*.tsx" -o -name "*.jsx" -o -name "*.ts" -o -name "*.js" \) -exec sed -i 's|https://play.google.com/store/apps/details?id=|android-app://|g' {} +
          find src -type f \( -name "*.tsx" -o -name "*.jsx" -o -name "*.ts" -o -name "*.js" \) -exec sed -i 's|market://details?id=|android-app://|g' {} +

      - name: Compilar projeto React (Vite)
        run: |
          cd bankseg.orig
          npm run build

      - name: Inicializar projeto Android nativo
        run: |
          cd bankseg.orig
          npx cap add android || true
          npx cap sync android

      - name: Injetar permissões de GPS e de abertura de aplicações no Android
        run: |
          cd bankseg.orig/android/app/src/main
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" \/>' AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>' AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>' AndroidManifest.xml

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Corrigir duplicações e compilar APK
        run: |
          cd bankseg.orig/android
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.5-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-8.2.1-bin.zip/gradle-8.5-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          sed -i '/allprojects {/a \    configurations.all { resolutionStrategy { eachDependency { if (requested.group == "org.jetbrains.kotlin") { useVersion "1.8.22" } } } }' build.gradle

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PastaSegura-App
          path: bankseg.orig/android/app/build/outputs/apk/debug/app-debug.apk
